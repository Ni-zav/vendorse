name: quality

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vendorse/database db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @vendorse/database exec prisma validate --schema prisma/schema.prisma

      - name: Render baseline migration SQL
        run: |
          pnpm --filter @vendorse/database exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/vendorse-baseline.sql
          cat /tmp/vendorse-baseline.sql

      - name: Build workspace
        run: pnpm build

      - name: Run API unit tests
        run: pnpm --filter api test --runInBand
