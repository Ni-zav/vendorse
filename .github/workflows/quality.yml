name: quality

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendorse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendorse?schema=public
      JWT_SECRET: ci-only-secret-not-used-outside-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vendorse/database db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @vendorse/database exec prisma validate --schema prisma/schema.prisma

      - name: Apply committed migrations to clean PostgreSQL
        run: pnpm --filter @vendorse/database db:migrate:deploy

      - name: Verify migration status
        run: pnpm --filter @vendorse/database exec prisma migrate status --schema prisma/schema.prisma

      - name: Build workspace
        run: pnpm build

      - name: Run API unit tests
        run: pnpm --filter api test --runInBand
